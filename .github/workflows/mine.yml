name: Mine data

on:
    schedule:
        - cron: '*/5 * * * *'
    workflow_dispatch:

concurrency:
    group: mine-data
    cancel-in-progress: false

jobs:
    mine:
        permissions:
            contents: write
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v4
              with:
                  ref: src

            - name: Checkout data
              uses: actions/checkout@v4
              with:
                  ref: data
                  path: data

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20.x'
                  cache: npm

            - run: npm ci

            - name: Configure Git
              run: |
                  git -C data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git -C data config user.name "github-actions[bot]"

            - name: Run script
              run: |
                  npm run build && npm run start
              env:
                  DATA_DIR: ${{ github.workspace }}/data
                  DATA_BRANCH: data
                  ALT_TOKEN: ${{ secrets.ALT_TOKEN }}
                  CATEGORIES: ${{ secrets.CATEGORIES }}
                  PROFILEEFFECTS: ${{ secrets.PROFILEEFFECTS }}
                  ASSETS: ${{ secrets.ASSETS }}
                  TOKEN: ${{ secrets.TOKEN }}
                  ACTIVITIES: ${{ secrets.ACTIVITIES }}
                  EXPCENTRALWEBHOOK: ${{ secrets.EXPCENTRALWEBHOOK }}
                  ACTIVIESWC: ${{ secrets.ACTIVIESWC }}
                  ACKNOWLEDGEMENTSWC: ${{ secrets.ACKNOWLEDGEMENTSWC }}
                  CHANGELOGS: ${{ secrets.CHANGELOGS }}
                  ROBOTS: ${{ secrets.ROBOTS }}
                  SERVERSWC: ${{ secrets.SERVERSWC }}
                  SERVERS: ${{ secrets.SERVERS }}
                  DOMAINS: ${{ secrets.DOMAINS }}
                  POWERUPSWC: ${{ secrets.POWERUPS }}
                  DOMAINSWC_: ${{ secrets.DOMAINSWC_ }}
